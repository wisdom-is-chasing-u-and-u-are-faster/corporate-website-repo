{% extends "base.html" % }
{% block content % }
<nav aria - label = "breadcrumb" >
   <ol class = "breadcrumb" >
        <li class = "breadcrumb-item" > <a href = "{{ url_for('blog') }}" > Blog < /a > < / li >
        <li class = "breadcrumb-item active" aria - current = "page" > {{post.title}} < /li >
    < / ol >
< / nav >

<h2 > {{ post.title }} < /h2>
<p class = "text-muted" > Published on {{ post.date }}</p>
<hr >
<div class = "mt-4" >
  {{post.content | safe}}
< / div >
<a href = "{{ url_for('blog') }}" class = "btn btn-outline-secondary mt-4">Back to Blog</a>
{ % endblock % }
