<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Forge Corporate Website{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        header { background: #0A2540; color: #fff; padding: 1rem 2rem; display: flex; justify-space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: #00B5E2; }
        main { min-height: 80vh; }
        footer { background: #0A2540; color: #8898AA; text-align: center; padding: 2rem; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="logo"><strong>Forge</strong></div>
        <nav>
            <a href="/home">Home</a>
            <a href="/solutions">Solutions</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact Us</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        &copy; Forge. All rights reserved.
    </footer>
</body>
</html>
