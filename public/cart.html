<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Reserved Cart — AURA LUXE</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="brand-title font-serif">AURA LUXE</a>
    <nav>
      <a href="index.html">Viral Drops</a>
      <a href="shade-finder.html">Shade Matcher</a>
      <a href="pdp.html">Serum Foundation</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="subscriptions.html">My Regimens</a>
    </nav>
  </header>

  <div class="container" style="max-width: 800px;">
    <!-- Live 10-Minute Lock Banner -->
    <div class="card" style="border: 2px solid var(--color-rose-gold); background: #FAF5F6; text-align: center;">
      <div style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--color-rose-gold);">
        🔒 Items Reserved Exclusively for You
      </div>
      <div id="cart-timer" class="countdown-timer" style="font-size: 2.25rem; margin: 0.5rem 0;">09:58</div>
      <p style="color: var(--color-text-muted); font-size: 0.85rem;">
        Your stock reservation is held for 10 minutes to guarantee checkout during viral drops.
      </p>
    </div>

    <!-- Cart Items Card -->
    <div class="card">
      <h2 class="font-serif" style="font-size: 1.5rem; margin-bottom: 1.25rem;">Reserved Items</h2>
      <div id="cart-items-list">
        <!-- Rendered dynamically -->
      </div>

      <div style="border-top: 1px solid var(--color-border); margin-top: 1.5rem; padding-top: 1.5rem;">
        <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem;">
          <span>Total</span>
          <span id="cart-total-price">$48.00</span>
        </div>

        <a href="checkout.html" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">
          Proceed to 1-Click Checkout →
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let reservation = null;
    let secondsLeft = 598;

    function init() {
      const stored = sessionStorage.getItem('active_reservation');
      if (stored) {
        reservation = JSON.parse(stored);
      } else {
        // Fallback demo reservation
        reservation = {
          reservation_id: '7f918074-b5a8-4bb5-9e48-ec8d5e1281df',
          status: 'RESERVED',
          ttl_seconds: 600,
          items: [{
            variant_id: 'd9b2d63d-a233-4f16-92f7-bc6024beee15',
            sku: 'AL-FDN-230W',
            shade_name: '230W Medium Honey Warm',
            quantity: 1,
            price: 48.00
          }]
        };
      }

      renderCart();
      startTimer();
    }

    function renderCart() {
      const list = document.getElementById('cart-items-list');
      list.innerHTML = '';
      let total = 0;

      reservation.items.forEach(item => {
        total += item.price * item.quantity;
        const row = document.createElement('div');
        row.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--color-border);';
        row.innerHTML = `
          <div>
            <div style="font-weight: 700; font-size: 1.05rem;">Luminous Radiance Serum Foundation</div>
            <div style="font-size: 0.85rem; color: var(--color-text-muted);">Shade: ${item.shade_name} (Qty: ${item.quantity})</div>
          </div>
          <div style="font-weight: 700; font-size: 1.1rem;">$${(item.price * item.quantity).toFixed(2)}</div>
        `;
        list.appendChild(row);
      });

      document.getElementById('cart-total-price').innerText = `$${total.toFixed(2)}`;
    }

    function startTimer() {
      setInterval(() => {
        if (secondsLeft > 0) {
          secondsLeft--;
          const mins = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
          const secs = (secondsLeft % 60).toString().padStart(2, '0');
          document.getElementById('cart-timer').innerText = `${mins}:${secs}`;
        } else {
          document.getElementById('cart-timer').innerText = '00:00 - EXPIRED';
        }
      }, 1000);
    }

    window.onload = init;
  </script>
</body>
</html>
